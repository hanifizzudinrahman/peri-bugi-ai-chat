# Pertanyaan emas Tanya Data Founder.
#
# Dinilai dengan EXECUTION ACCURACY: SQL yang ditulis model dijalankan, SQL emas
# di sini dijalankan, lalu HASILNYA yang dibandingkan. Query yang ditulis
# berbeda tapi mengembalikan angka sama tetap lulus — yang diukur jawabannya,
# bukan gayanya.
#
# `mode` menentukan seberapa ketat perbandingannya:
#   exact  — himpunan baris harus sama persis (setelah diurutkan)
#   scalar — cukup angka di sel pertama yang sama
#   shape  — cukup jumlah baris dan nama kolom yang sepadan
#
# `chart` menyatakan bentuk grafik yang MASUK AKAL untuk pertanyaan itu.
# `none` berarti grafik justru salah — satu angka tidak digambar, dan grafik
# satu batang lebih sulit dibaca daripada angkanya sendiri.

cases:
  # ── Akuisisi ────────────────────────────────────────────────────────────
  - id: akuisisi-total-orang-tua
    question: "Berapa total orang tua yang sudah mendaftar?"
    mode: scalar
    chart: none
    sql: >
      SELECT count(*) AS jumlah FROM nlf.v_user
      WHERE role_name = 'parent' AND NOT is_internal

  - id: akuisisi-tren-bulanan
    question: "Tren pendaftaran orang tua per bulan"
    mode: exact
    chart: bar
    sql: >
      SELECT to_char(registered_date_wib, 'YYYY-MM') AS bulan, count(*) AS pendaftar
      FROM nlf.v_user WHERE role_name = 'parent' AND NOT is_internal
      GROUP BY 1 ORDER BY 1

  - id: akuisisi-onboarding
    question: "Berapa persen akun orang tua yang sudah menyelesaikan onboarding?"
    mode: scalar
    chart: none
    sql: >
      SELECT round(100.0 * count(*) FILTER (WHERE onboarding_completed)
      / NULLIF(count(*), 0), 1) AS persen
      FROM nlf.v_user WHERE role_name = 'parent' AND NOT is_internal

  - id: akuisisi-sekolah-teratas
    question: "Sekolah mana yang paling banyak anaknya?"
    mode: exact
    chart: bar
    sql: >
      SELECT school_name, child_count FROM nlf.v_school
      WHERE child_count > 0 ORDER BY child_count DESC, school_name

  - id: akuisisi-sebaran-umur
    question: "Sebaran umur anak yang terdaftar"
    mode: exact
    chart: bar
    sql: >
      SELECT age_years, count(*) AS jumlah FROM nlf.v_child
      GROUP BY age_years ORDER BY age_years

  # ── Retensi — dua yang paling sulit ─────────────────────────────────────
  # Keduanya menuntut penyebut diambil dari daftar anak, bukan dari catatan
  # perilakunya. Kalau model memulai dari view perilaku, angkanya bias ke atas
  # dan kelihatan wajar — itu justru kesalahan yang paling sulit ketahuan.
  - id: retensi-belum-pernah-sikat
    question: "Berapa anak yang belum pernah mencatat sikat gigi sama sekali?"
    mode: scalar
    chart: none
    sql: >
      SELECT count(*) AS belum_pernah FROM nlf.v_brushing_streak
      WHERE NOT has_ever_brushed

  - id: retensi-kepatuhan-30-hari
    question: "Kepatuhan sikat gigi 30 hari terakhir, seluruh pengguna, per hari"
    mode: exact
    chart: line
    sql: >
      SELECT log_date,
             round(100.0 * count(*) FILTER (WHERE is_brushed)
             / NULLIF(count(*), 0), 1) AS persen_patuh
      FROM nlf.v_brushing_daily_recent
      WHERE log_date >= CURRENT_DATE - 30 GROUP BY 1 ORDER BY 1

  - id: retensi-pagi-vs-malam
    question: "Pagi atau malam yang lebih sering terlewat, seluruh pengguna?"
    mode: exact
    chart: bar
    sql: >
      SELECT slot, count(*) FILTER (WHERE NOT is_brushed) AS terlewat
      FROM nlf.v_brushing_daily_recent
      WHERE log_date >= CURRENT_DATE - 30 GROUP BY slot ORDER BY slot

  # ── Mata Peri ───────────────────────────────────────────────────────────
  - id: mata-peri-persen-gagal
    question: "Berapa persen scan Mata Peri yang gagal bulan ini?"
    mode: scalar
    chart: none
    sql: >
      SELECT round(100.0 * count(*) FILTER (WHERE status <> 'completed' OR NOT has_result)
      / NULLIF(count(*), 0), 1) AS persen_gagal
      FROM nlf.v_mata_peri_scan
      WHERE created_date_wib >= date_trunc('month', CURRENT_DATE)::date

  - id: mata-peri-tren-harian
    question: "Tren jumlah scan per hari 30 hari terakhir"
    mode: exact
    chart: line
    sql: >
      SELECT created_date_wib, count(*) AS sesi FROM nlf.v_mata_peri_scan
      WHERE created_date_wib >= CURRENT_DATE - 30 GROUP BY 1 ORDER BY 1

  - id: mata-peri-durasi-per-model
    question: "Rata-rata durasi analisa per versi model"
    mode: shape
    chart: bar
    sql: >
      SELECT model_version, round(avg(duration_seconds), 1) AS rata_detik
      FROM nlf.v_mata_peri_job WHERE duration_seconds IS NOT NULL
      GROUP BY 1 ORDER BY 1

  # ── Janji Peri ──────────────────────────────────────────────────────────
  - id: janji-status-per-fasilitas
    question: "Janji temu selesai vs tidak hadir per fasilitas"
    mode: shape
    chart: bar
    sql: >
      SELECT facility_name,
             count(*) FILTER (WHERE status = 'completed') AS selesai,
             count(*) FILTER (WHERE status = 'no_show') AS tidak_hadir
      FROM nlf.v_appointment WHERE facility_name IS NOT NULL
      GROUP BY 1 ORDER BY 1

  - id: janji-lead-time
    question: "Rata-rata berapa hari sebelumnya orang memesan janji temu?"
    mode: scalar
    chart: none
    sql: >
      SELECT round(avg(lead_time_days), 1) AS rata_hari FROM nlf.v_appointment
      WHERE lead_time_days >= 0 AND NOT is_reschedule

  # ── Cerita Peri ─────────────────────────────────────────────────────────
  - id: cerita-corong-modul
    question: "Corong penyelesaian modul Cerita Peri"
    mode: exact
    chart: bar
    sql: >
      SELECT module_id,
             count(*) FILTER (WHERE completed_at IS NOT NULL) AS selesai,
             count(*) AS mulai
      FROM nlf.v_cerita_progress GROUP BY 1 ORDER BY 1

  # ── Tanya Peri ──────────────────────────────────────────────────────────
  - id: tanya-pesan-per-sesi
    question: "Rata-rata berapa pesan per sesi Tanya Peri?"
    mode: scalar
    chart: none
    sql: >
      SELECT round(avg(message_count), 1) AS rata_pesan FROM nlf.v_chat_session

  - id: tanya-thumbs-down
    question: "Berapa persen jawaban Tanya Peri yang dapat jempol ke bawah 30 hari terakhir?"
    mode: scalar
    chart: none
    sql: >
      SELECT round(100.0 * count(*) FILTER (WHERE is_positive_feedback = FALSE)
      / NULLIF(count(*) FILTER (WHERE is_positive_feedback IS NOT NULL), 0), 1) AS persen
      FROM nlf.v_chat_message_stat WHERE role = 'assistant'
      AND created_date_wib >= CURRENT_DATE - 30

  # ── Biaya ───────────────────────────────────────────────────────────────
  - id: biaya-token-harian
    question: "Token LLM per hari bulan ini"
    mode: exact
    chart: line
    sql: >
      SELECT created_date_wib, sum(total_tokens) AS token FROM nlf.v_llm_call
      WHERE created_date_wib >= date_trunc('month', CURRENT_DATE)::date
      GROUP BY 1 ORDER BY 1

  - id: biaya-model-terbanyak
    question: "Model mana yang paling banyak dipakai bulan ini?"
    mode: shape
    chart: bar
    sql: >
      SELECT model, sum(total_tokens) AS token FROM nlf.v_llm_cost_daily
      WHERE date_wib >= date_trunc('month', CURRENT_DATE)::date
      GROUP BY 1 ORDER BY token DESC

  # ── Jalur data pribadi ──────────────────────────────────────────────────
  # Model HARUS memilih v_user_directory di sini, dan HARUS TIDAK memilihnya
  # untuk pertanyaan hitungan biasa di atas.
  - id: pii-pendaftar-terakhir
    question: "Siapa 5 orang tua yang terakhir mendaftar?"
    mode: shape
    chart: none
    expect_pii: true
    sql: >
      SELECT full_name, phone_number, registered_date_wib
      FROM nlf.v_user_directory WHERE role_name = 'parent' AND NOT is_internal
      ORDER BY registered_at DESC LIMIT 5

# Yang sengaja TIDAK dihitung sebagai lulus, tapi tetap diukur supaya
# angkanya tidak berbohong. Kalau salah satu mulai lulus, pindahkan ke `cases`.
known_gaps:
  - id: gap-churn
    question: "Berapa pengguna yang berhenti pakai aplikasi bulan ini?"
    alasan: >
      Nol soft delete di seluruh model — penghapusan bersifat cascade. Churn
      tidak bisa dihitung dari data yang ada. Jawaban yang benar adalah
      mengatakan itu, bukan mengarang angka.

  - id: gap-tagihan-historis
    question: "Berapa rupiah biaya LLM bulan Juni?"
    alasan: >
      Harga vendor berlaku-tanggal dan kurs berubah. Katalog sengaja tidak
      menyediakan tabel harga yang bisa di-join. Jawaban yang benar adalah
      menyebut token dan mengarahkan ke ekspor Pusat Biaya.

  - id: gap-zona-waktu-pengguna
    question: "Jam berapa anak-anak di Indonesia timur biasanya sikat gigi?"
    alasan: >
      Tidak ada `users.timezone` di sistem ini. Semua batas hari memakai
      Asia/Jakarta. Pertanyaan per-zona-waktu tidak bisa dijawab jujur.
